    <!-- The final o leads into one returning sweep. -->
    <path class="ink" pathLength="1" style="--duration: 225ms; --start: 2017ms; --weight: 6.6; --pace: cubic-bezier(.23, .3, .58, 1)"
      d="M768 196 C786 187 798 179 804 175 C786 201 706 226 587 251 C451 280 282 308 233 294 C212 288 247 273 294 260"/>
    <path class="ink" pathLength="1" style="--duration: 174ms; --start: 2216ms; --weight: 4.8; --pace: cubic-bezier(.2, .5, .55, 1)"
      d="M294 260 C435 220 663 194 793 197 C832 198 861 200 883 205"/>
  </g>
</svg>
