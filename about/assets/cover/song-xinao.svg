      d="M583 160 Q587 155 590 154"/>
    <path class="ink" pathLength="1" style="--duration: 77ms; --start: 1732ms; --weight: 6.1"
      d="M647 167 Q656 161 656 153"/>
    <path class="ink" pathLength="1" style="--duration: 259ms; --start: 1785ms; --weight: 7.2"
